name: Probe fuentes de datos

on:
  workflow_dispatch:
  push:
    paths:   # corre solo cuando cambia el probe, no con cada commit
      - probe_fuentes.py
      - .github/workflows/probe.yml

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python probe_fuentes.py
