name: Probe fuentes de datos

on:
  workflow_dispatch:   # solo a mano: verifica que fuentes de velas responden desde GitHub

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python probe_fuentes.py
