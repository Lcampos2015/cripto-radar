name: Briefing diario

on:
  # Sin "schedule" a proposito: el 2026-10-03 GitHub salteo el cron de las 19:05.
  # Lo lanza el Worker de Cloudflare (cloudflare/worker.js) a las 00:05 UTC = 19:05 Peru
  # via workflow_dispatch. Si GitHub tuviera su propio cron, podria llegar duplicado.
  workflow_dispatch:

jobs:
  briefing:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Armar y enviar el briefing
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: python briefing.py
